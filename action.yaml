name: Setup CODESYS 4
author: Krystian Poyma
description: Install CODESYS 4 on a Debian-based runner

branding:
  icon: "package"
  color: "red"

inputs:
  version:
    description: CODESYS 4 version to install
    default: "1.0.0.0"
  deb-url:
    description: Override the download URL (optional)
    default: ""
  sha256:
    description: Expected SHA-256 (optional, overrides the built-in value)
    default: ""

outputs:
  version:
    description: Installed CODESYS 4 version
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check runner OS
      if: runner.os != 'Linux'
      shell: bash
      run: | # bash
        echo "::error::This action is only supported on Linux runners."
        exit 1

    - name: Check runner architecture
      if: runner.arch != 'X64'
      shell: bash
      run: | # bash
        echo "::error::This action is only supported on X64 (amd64) runners."
        exit 1

    - name: Check package manager
      shell: bash
      run: | # bash
        command -v apt-get >/dev/null && command -v dpkg >/dev/null || {
          echo "::error::apt-get/dpkg not found (Debian-based Linux required)."
          exit 1
        }

    - name: Validate reviewed release manifest
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/validate_release_manifest.py"

    - name: Restore .deb cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/codesys4
        key: codesys4-deb-${{ inputs.version }}-${{ hashFiles(format('{0}/releases/codesys4-linux-amd64.json', github.action_path)) }}

    - name: Download and verify
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEB_URL: ${{ inputs.deb-url }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        manifest="${{ github.action_path }}/releases/codesys4-linux-amd64.json"
        manifest_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")"
        url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$manifest")"
        expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$manifest")"
        [ "$VERSION" = "$manifest_version" ] || { echo "::error::Requested version is not in the reviewed release manifest"; exit 1; }
        [ -z "$DEB_URL" ] || [ "$DEB_URL" = "$url" ] || { echo "::error::deb-url must match the reviewed manifest URL"; exit 1; }
        [ -z "$SHA256" ] || [ "$SHA256" = "$expected" ] || { echo "::error::sha256 must match the reviewed manifest pin"; exit 1; }

        mkdir -p ~/.cache/codesys4
        deb=~/.cache/codesys4/codesys-4.deb
        [ -f "$deb" ] || curl -fSL "$url" -o "$deb"

        actual="$(sha256sum "$deb" | cut -d' ' -f1)"
        echo "SHA-256 of downloaded package: $actual"
        [ "$expected" = "$actual" ] || { echo "SHA-256 mismatch" >&2; exit 1; }

    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y ~/.cache/codesys4/codesys-4.deb

    - name: Read version
      id: ver
      shell: bash
      run: echo "version=$(c4-cli version)" >> "$GITHUB_OUTPUT"
