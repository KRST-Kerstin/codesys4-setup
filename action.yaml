name: Setup CODESYS 4
author: Krystian Poyma
description: Install CODESYS 4 on a Debian-based runner

branding:
  icon: "package"
  color: "red"

inputs:
  version:
    description: CODESYS 4 version to install
    default: "1.0.0.0"
  deb-url:
    description: Optional assertion that must exactly match the reviewed manifest URL
    default: ""
  sha256:
    description: Optional assertion that must exactly match the reviewed manifest SHA-256
    default: ""
  libraries:
    description: Reserved optional libraries list; non-empty values are currently unsupported
    default: ""

outputs:
  version:
    description: Installed CODESYS 4 version
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check runner OS
      if: runner.os != 'Linux'
      shell: bash
      run: | # bash
        echo "::error::This action is only supported on Linux runners."
        exit 1

    - name: Check runner architecture
      if: runner.arch != 'X64'
      shell: bash
      run: | # bash
        echo "::error::This action is only supported on X64 (amd64) runners."
        exit 1

    - name: Check package manager
      shell: bash
      run: | # bash
        command -v apt-get >/dev/null && command -v dpkg >/dev/null || {
          echo "::error::apt-get/dpkg not found (Debian-based Linux required)."
          exit 1
        }

    - name: Validate optional libraries input
      shell: bash
      env:
        LIBRARY_IDS: ${{ inputs.libraries }}
      run: python3 "${{ github.action_path }}/scripts/validate_library_input.py"

    - name: Validate reviewed release manifest
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/validate_release_manifest.py"

    - name: Verify and install pinned package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEB_URL: ${{ inputs.deb-url }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        python3 "${{ github.action_path }}/scripts/install_verified_package.py" \
          --manifest "${{ github.action_path }}/releases/codesys4-linux-amd64.json" \
          --version "$VERSION" --url "$DEB_URL" --sha256 "$SHA256"

    - name: Read version
      id: ver
      shell: bash
      run: echo "version=$(c4-cli version)" >> "$GITHUB_OUTPUT"
